<!DOCTYPE html>
<html>

<body style="font-family:Arial;background:#f5f5f5;padding:20px;">


<div style="max-width:600px;background:white;padding:30px;margin:auto;border-radius:10px;">


<h2 style="color:#204452;">
New Clinic Approval Request
</h2>


<p>
A new clinic registration requires your approval.
</p>


<h3>Clinic Details</h3>


<p>
<b>Clinic Name:</b>
{{ clinic_name }}
</p>


<p>
<b>Owner Email:</b>
{{ owner_email }}
</p>


<p>
<b>Phone:</b>
{{ phone }}
</p>


<p>
<b>Address:</b>
{{ address }}
</p>



<div style="margin-top:30px;">


<a href="{{ approve_url }}"
style="
background:#28a745;
color:white;
padding:12px 20px;
text-decoration:none;
border-radius:5px;
margin-right:10px;
">

Approve Clinic

</a>



<a href="{{ reject_url }}"
style="
background:#dc3545;
color:white;
padding:12px 20px;
text-decoration:none;
border-radius:5px;
">

Reject Clinic

</a>


</div>


</div>


</body>
</html>
